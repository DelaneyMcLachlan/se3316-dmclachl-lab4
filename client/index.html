<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
   
    <title>Superheroes search</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Superhero Search & Save</h1>
    </header>

    <section>
        <h2>Search Superheroes</h2>
        <input type="text" id="superheroNameInputVal" placeholder="Search Superheroes by Name">
        <button id="searchbyNameBtn">Search</button>

    <input type="text" id="superheroIDInputVal" placeholder="Search Superheroes by ID">
    <button id="searchByIDBtn">Search</button>

    <input type="text" id="publisherInputVal" placeholder="Search Superheroes by Publisher">
    <button id="searchByPublisherBtn">Search</button>

    <input type="text" id="superHeroRaceInputVal" placeholder="Search Superheroes by Race">
    <button id="searchByRaceBtn">Search</button>

        <ul id="allSearchResults"></ul>
    </section>

    <script src="client.js"></script>
</body>

</html>
