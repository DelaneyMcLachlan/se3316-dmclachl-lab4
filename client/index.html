<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
   
    <title>Superheroes search</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Superhero Search & Save</h1>
    </header>

    <section>
        <h2>Search Superheroes</h2>
        <input type="text" id="superheroNameInputVal" placeholder="Search Superheroes by Name">
        <button id="searchbyNameBtn">Search</button>

    <input type="text" id="superheroIDInputVal" placeholder="Search Superheroes by ID">
    <button id="searchByIDBtn">Search</button>

    <input type="text" id="publisherInputVal" placeholder="Search Superheroes by Publisher">
    <button id="searchByPublisherBtn">Search</button>

    <input type="text" id="superHeroRaceInputVal" placeholder="Search Superheroes by Race">
    <button id="searchByRaceBtn">Search</button>

        <ul id="allSearchResults"></ul>
    </section>


    <section>
        <h2>Search by Power</h2>
        <select id="powerSelection">

        </select>
        <button id="searchByPowerBtn">Search</button>
        <ul id="powersResults"></ul>
    </section>
    
    

    <section>
        <h2>Save Superheroes to List</h2>
<input type="text" id="listName" placeholder="List Name">
<button id="addNewListButton">Create New SuperHero List</button>

<section>
    <h2>Add Heroes to List</h2>
    <form id="addSuperheroesToList">
        <input type="text" id="addSuperheroesToListName" placeholder="Super Hero List Name" required>
        <input type="text" id="superheroIds" placeholder="Superhero IDs (separate by comma)" required>
        <button type="submit">Add to List</button>
    </form>
</section>




<ul id="allLists"></ul>

    </section>

    <section>
        <h2>Superhero Information from List</h2>
        <select id="superheroesListDropdown">
            <option value="">Select a List to Display</option>
           
        </select>
        <!-- <button id="showDetailsButton">Show Details</button>-->
        
        <div id="detailsDisplay">
            

        </div>
    </section>

    <div id="superheroDetailsContainer"></div>

<script src="client.js"></script>
</body>

</html>
